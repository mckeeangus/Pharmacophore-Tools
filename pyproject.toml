[project]
name = "pharmpipe"
version = "0.1.0"
description = "Automated pharmacophore-model construction pipeline (PDB ligand scrape & catalogue stage)."
authors = [{ name = "Angus McKee", email = "u7457676@anu.edu.au" }]
requires-python = ">=3.11"
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharmpipe"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]
extend-exclude = [".pixi", "data", "catalogue", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
