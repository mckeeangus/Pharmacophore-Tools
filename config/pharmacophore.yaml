# config/pharmacophore.yaml

# --- Feature extraction (RDKit) ---------------------------------------------
features:
  # `base` = RDKit's BaseFeatures.fdef (RDConfig.RDDataDir). A path to a custom
  # .fdef file may be given instead to change the chemistry definitions.
  fdef: base
  # Pharmacophore feature families to extract and model.
  families: [Donor, Acceptor, LumpedHydrophobe, Aromatic, PosIonizable, NegIonizable]
  # Co-atom feature hierarchy. RDKit assigns some atoms to several families at once
  # (a protonated amine N is BOTH PosIonizable and Donor; a carboxylate O is BOTH
  # NegIonizable and Acceptor; an aromatic ring is BOTH Aromatic and LumpedHydrophobe).
  # Left alone this double-counts one atom as two features, so the more-specific type
  # can lose the downstream support/size vote to its redundant partner. Each group
  # below is ordered highest-priority first; when two families in the SAME group are
  # perceived on a SHARED atom, only the higher one is kept (purely to remove the
  # redundant co-incident point.
  # Genuine dual roles are deliberately absent and so preserved: a hydroxyl stays
  # Donor+Acceptor; an aromatic ring heteroatom (pyridine/pyrrole) stays
  # Aromatic+Acceptor/Donor; a lone aliphatic hydrophobe (no aromatic overlap) is kept.
  feature_hierarchy:
    - [PosIonizable, Donor]            # protonated base: cation subsumes its donor
    - [PosIonizable, LumpedHydrophobe]
    - [NegIonizable, Acceptor]         # deprotonated acid: anion subsumes its acceptor
    - [NegIonizable, LumpedHydrophobe]
  # Display colours (RGB 0–1) shared by the PyMOL session/`.pml` and the
  # matplotlib raw-data plots, so a family looks the same everywhere.
  colors:
    Donor:            [1.00, 0.40, 0.70]   # pink   — H-bond donor (HBD)
    Acceptor:         [0.00, 0.80, 0.00]   # green  — H-bond acceptor (HBA)
    LumpedHydrophobe: [0.00, 0.90, 0.90]   # cyan   — hydrophobic
    Aromatic:         [1.00, 0.85, 0.00]   # yellow — aromatic ring
    PosIonizable:     [1.00, 0.00, 0.00]   # red    — positive ionisable
    NegIonizable:     [1.00, 0.45, 0.00]   # orange — negative ionisable (uncoloured by request; kept distinct)

# --- Density (consensus strategy) -------------------------------------------
# The scientific knobs are the length scale (voxel/bandwidth), the occupancy floor, and
# the membership radius (which defines support).
density:
  voxel: 1.0              # grid spacing (A) — spatial resolution of the field
  bandwidth: 1.5         # Gaussian smoothing sigma (A) of the field that sets feature
                         #   POSITIONS and tolerances (~ target feature tolerance).
  peak_bandwidth: null   # smoothing sigma (A) of the SEPARATE field the peaks are read off,
                         #   and the min spacing between two kept peaks.
  occupancy_floor: 2.0   # keep a peak only if its basin's summed distinct-molecule
                         #   weight >= this (units: effective molecules)
  # A ligand SUPPORTS a peak only if it has a feature point within this radius (A) of the
  # peak centre; support = distinct supporting ligands / total ligands (the 0.5 selection
  # floor gates on it). A hard-membership cutoff so a far basin outlier no longer counts.
  membership_radius: 1.5
  scaffold_weighting: false  # also weight points by inverse Murcko-scaffold frequency
  # Cross-family overlap merge (opt-in, default off). Same-family overlaps need no merge: the grid
  # already collapses peaks closer than `bandwidth` at detection, so two features of one family are
  # never nearer than that. This handles the DIFFERENT-family case — a region claimed by two families
  # (a donor and an acceptor on the same spot). On, the dominant peak (more points, then support)
  # wins and the other is dropped (logged in model_summary.md's "Merged away ... in favour of"
  # table); off, both are kept, since one region can genuinely be several pharmacophore types.
  merge_cross_family: false
  merge_radius: 1.0  # region cutoff (A), centre-to-centre; null => geometric (larger tolerance radius)
  # Cross-family pairs never merged into each other (compatible co-located roles):
  merge_exempt_pairs:
    - [Donor, Acceptor]
    - [Aromatic, LumpedHydrophobe]
  # Coincident-feature resolution (opt-in, default off). A functional group can present two
  # pharmacophore profiles at one locus (a pyridine is Aromatic + Acceptor, ~1.4 A apart); within
  # that group they always co-occur, so co-occurrence alone cannot say which is critical for binding.
  # This keeps a coincident feature only where the data DECOUPLES it: >= coincidence_min_support
  # ligands present it with a same-family point at the locus but NO partner-family point there (e.g.
  # acetylcholine gives the nAChR cation/acceptor with no aromatic). If exactly one of a coincident
  # pair clears that bar it is kept and the other dropped; if both (each binds standalone) or neither
  # (no decoupling evidence) clear it, both are kept. Resolutions are logged in model_summary.md.
  resolve_coincident_features: false
  coincidence_radius: 2.0        # centre-to-centre (A) for two cross-family features to be one locus
  coincidence_min_support: 2     # distinct ligands presenting a feature decoupled to call it standalone

# --- Peak -> kept feature selection -----------------------------------------
selection:
  # Warning provided if fewer than this many ligands are available
  min_ligands: 10
  # Keep a peak only if it draws support from at least this fraction of the ligands in
  # the cell.  This 0.5 floor is the main feature-selection gate.
  min_support_fraction: 0.5
  min_cluster_size: 2          # minimum feature points behind a peak (sweep display floor)

# --- Tolerance (kept feature sphere radius, Angstrom) -----------------------
tolerance:
  # density_quantile: radius encloses `quantile` of the feature's (density-weighted) mass
  #   from the centre, so the far points still assigned to the cluster do not inflate it.
  #   (rmsd — root-mean-square point-to-centre distance — is the tail-sensitive alternative.)
  method: density_quantile
  quantile: 0.75               # fraction of density mass inside the sphere; lower = tighter
  min: 1.0                     # clamp so a tight cluster still has a usable radius
  max: 3.0                     # and a diffuse cluster does not balloon

# --- Alignment (align-molecules) ---------------------------------------------
alignment:
  # Conformer ensemble per ligand (RDKit ETKDG v3 + MMFF).
  n_conformers: 64             # embeds attempted per ligand
  energy_window: 10.0
  rmsd_prune: 0.5              # ETKDG pruneRmsThresh (A) — drop near-duplicate embeds
  max_confs: 40                # cap the kept ensemble (energy-sorted)
  # Feature-clique correspondence: two features match only if same-family and their
  # intra-molecular distances agree within dist_tol; a rigid 3-D alignment needs >= min_clique
  # mutually-consistent matches (3 = a determined transform). Compounds that cannot reach
  # min_clique against the model are dropped (recorded in alignment_manifest.csv).
  dist_tol: 1.5                # correspondence distance tolerance (A)
  min_clique: 3                # minimum mutually-consistent feature matches to align
  # Also model genuinely TWO-point pharmacophores that a strict min_clique=3 would drop — but only
  # where a two-feature overlay is well-posed: (a) orientation-determined (a directional
  # Donor/Acceptor projected point gives the third constraint, e.g. cation + directional acceptor),
  # or (b) roll-irrelevant (the compound has only two features, so the one undetermined rotational
  # DOF moves nothing contributed). A compound matching only two of its 3+ features with no
  # directionality is NOT admitted (its free roll would misplace the rest). A >=min_clique match
  # always out-ranks a two-feature one, so this fires only when nothing larger exists. Without it,
  # requiring 3 features biases two-point targets (e.g. the nicotinic cation/acceptor pharmacophore)
  # by dropping the minimal actives and over-fitting a third (aromatic) feature from the survivors.
  two_feature_alignment: true
  align_families: null         # families driving alignment; null => all features.families
  seed_k: 5                    # docked poses used to seed the model (the bioactive frame)
  # Accept a compound into the growing model only if its best clique superposition RMSD is
  # <= this (A); poorer fits are dropped.
  max_align_rmsd: 1.5
  # Correspondence-graph size above which the clique search switches from exact Bron-Kerbosch
  # (exponential) to a bounded greedy search — keeps feature-rich ligands (many H-bond/aromatic
  # features) tractable. Small molecules stay under it and are solved exactly (unchanged).
  max_clique_nodes: 40
  # refinement after the initial growing pass. Stop when largest feature shift is < em_tol (A)
  em_iterations: 5
  em_tol: 0.1
  # Orientation-aware matching: also fit H-bond donor/acceptor PROJECTED points (feature centre +
  # projected_length A along the perceived lone-pair / D-H vector) in the superposition.
  use_directions: true
  projected_length: 1.5
  # Also fit the AROMATIC ring normal in the superposition.
  aromatic_axial: true
