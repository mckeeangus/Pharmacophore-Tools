# Protonation microstate selection at physiological pH (Stage-4 prep).
#
# pkasolver predicts a pKa for every ionizable site and the dominant microstate at the
# target pH is chosen by a Henderson-Hasselbalch ladder walk (pharmpipe/prep/protonate.py).
# pkasolver is accurate for ISOLATED ionizable centres but systematically OVER-DEPROTONATES
# weak acids (O-H, N-H) that sit on complex, poly-ionizable scaffolds: adjacent-charge
# electrostatics, intramolecular H-bonds, and second/third-ionization (macrostate) effects
# are invisible to a molecular-graph GNN and under-represented in its training window. The
# same blind spot affects every current graph pKa model (QupKake, MolGpKa, ...), so it is
# not fixed by a heavier predictor. Observed across this set, pkasolver returned the
# conjugate BASE at pH 7.4 for phenols (salicylate, gallate, tyrosine, estradiol),
# aliphatic/sugar alcohols, amides, primary sulfonamides, and amino-heteroaromatics —
# corrupting donor/acceptor/±ionizable perception. See catalogue/pharmacophore_method.md §2.1.
#
# Weak-acid guard (this file): the classes below have aqueous pKa well above 7.4 and are
# therefore NEUTRAL (protonated) at physiological pH. After the ladder walk, any member
# left as its conjugate base is re-protonated in the final microstate, UNLESS it matches a
# genuinely-acidic structural exception (which keeps pkasolver's deprotonation). The guard
# is purely ADDITIVE — it only ever adds a proton — so it cannot touch carboxylates,
# phosphates, protonated amines, or any centre pkasolver handles correctly. It is a general
# STRUCTURAL prior, not a per-compound literature pKa assignment.
#
# Deliberately NOT guarded (left to pkasolver): aromatic ring N-H (tetrazolate,
# imidazolate) and enols / vinylogous acids (tropolones, tetramic/tetronic acids,
# 4-hydroxycoumarins) are genuinely acidic; cofactor lactams (guanine/uracil) only occur
# in review-track cofactors that never enter a built cell.

weak_acid_guard:
  enabled: true
  # Each class: an `anion` SMARTS whose FIRST atom is the conjugate-base heteroatom to
  # re-protonate, and optional `exceptions` (same anchor atom) that stay deprotonated.
  classes:
    - name: phenol                 # ArOH, pKa ~10 (phenol 9.99, tyrosine 10.1)
      anion: "[OX1-]-c1ccccc1"
      exceptions:
        - "[OX1-]c1ccccc1[$([NX3](=O)=O),$([NX3+]([O-])=O)]"      # o-nitrophenol ~7.2
        - "[OX1-]c1ccc([$([NX3](=O)=O),$([NX3+]([O-])=O)])cc1"    # p-nitrophenol ~7.2 (+ all polynitro)
        - "[OX1-]c1ccccc1C#N"                                      # o-cyanophenol ~6.9
        - "[OX1-]c1ccc(C#N)cc1"                                    # p-cyanophenol ~8.0
        - "[OX1-]c1c([F,Cl,Br,I])cc([F,Cl,Br,I])cc1[F,Cl,Br,I]"   # 2,4,6-trihalo / perhalo
    - name: alcohol                # aliphatic/sugar C-OH, pKa ~16; sp3-C anchor excludes carboxylate/phosphate
      anion: "[OX1-][CX4]"
    - name: amide                  # R-C(=O)-N(-), pKa ~17; excludes imide & acylsulfonamide (genuinely acidic)
      anion: "[$([NX2-][CX3]=[OX1]);!$([NX2-]([CX3]=O)[CX3]=O);!$([NX2-]([CX3]=O)[SX4](=O)=O)]"
    - name: sulfonamide            # R-S(=O)2-N(-), pKa ~10; excludes acylsulfonamide (acidic). CA2 Zn-binding
      anion: "[$([NX2-][SX4](=O)=O);!$([NX2-]([SX4](=O)=O)[CX3]=O)]"   # warhead -> neutral solution state (Zn-bound anion out of scope)
    - name: aryl_amine             # exocyclic amino/anilino on (hetero)arene (e.g. aminopyrimidine), pKa >> 7.4
      anion: "[$([NX2-]a);!$([NX2-][CX3]=O);!$([NX2-][SX4](=O)=O)]"
