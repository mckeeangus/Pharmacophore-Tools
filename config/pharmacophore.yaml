# config/pharmacophore.yaml
# Stage 4 — ligand-based ensemble pharmacophore construction.
#
# All SCIENTIFIC choices live here, never in code: which feature families to use,
# how to cluster their points into consensus positions, which clusters to keep, and
# how the tolerance radius is derived. Swapping `clustering.method` (see
# pharmpipe/clustering/registry.py) changes only the feature positions — the output
# file format is identical, so methods are directly comparable.

# --- Feature extraction (RDKit) ---------------------------------------------
features:
  # `base` = RDKit's BaseFeatures.fdef (RDConfig.RDDataDir). A path to a custom
  # .fdef file may be given instead to change the chemistry definitions.
  fdef: base
  # Pharmacophore feature families to extract and model. The TeachOpenCADD T009
  # tutorial uses Donor/Acceptor/Hydrophobe; the others are included because our
  # binding sites are more diverse (charged and aromatic contacts matter).
  # We use RDKit's `LumpedHydrophobe` rather than the per-atom `Hydrophobe`: the
  # lumped family collapses a contiguous hydrophobic group (e.g. a whole alkyl
  # chain or ring face) into a single centroid feature, instead of emitting one
  # point per carbon. That stops hydrophobes swamping the model.
  families: [Donor, Acceptor, LumpedHydrophobe, Aromatic, PosIonizable, NegIonizable]
  # Co-atom feature hierarchy. RDKit assigns some atoms to several families at once
  # (a protonated amine N is BOTH PosIonizable and Donor; a carboxylate O is BOTH
  # NegIonizable and Acceptor; an aromatic ring is BOTH Aromatic and LumpedHydrophobe).
  # Left alone this double-counts one atom as two features, so the more-specific type
  # can lose the downstream support/size vote to its redundant partner. Each group
  # below is ordered highest-priority first; when two families in the SAME group are
  # perceived on a SHARED atom, only the higher one is kept (purely to remove the
  # redundant co-incident point — it never overrides a genuine count of distinct atoms).
  # Genuine dual roles are deliberately absent and so preserved: a hydroxyl stays
  # Donor+Acceptor; an aromatic ring heteroatom (pyridine/pyrrole) stays
  # Aromatic+Acceptor/Donor; a lone aliphatic hydrophobe (no aromatic overlap) is kept.
  feature_hierarchy:
    - [PosIonizable, Donor]            # protonated base: cation subsumes its donor
    - [PosIonizable, LumpedHydrophobe]
    - [NegIonizable, Acceptor]         # deprotonated acid: anion subsumes its acceptor
    - [NegIonizable, LumpedHydrophobe]
  # NOTE: `[Aromatic, LumpedHydrophobe]` is deliberately NOT here. An aromatic ring is
  # genuinely both aromatic and lipophilic, and literature models (Catalyst HydrophobicAromatic
  # / HypoGen) report a hydrophobic feature on rings. Keeping both perceptions — and exempting
  # the pair from the overlap merge (see `density.merge_exempt_pairs`) — lets a ring contribute
  # to both families instead of vanishing from the hydrophobic count.
  # Display colours (RGB 0–1) shared by the PyMOL session/`.pml` and the
  # matplotlib raw-data plots, so a family looks the same everywhere.
  colors:
    Donor:            [1.00, 0.40, 0.70]   # pink   — H-bond donor (HBD)
    Acceptor:         [0.00, 0.80, 0.00]   # green  — H-bond acceptor (HBA)
    LumpedHydrophobe: [0.00, 0.90, 0.90]   # cyan   — hydrophobic
    Aromatic:         [1.00, 0.85, 0.00]   # yellow — aromatic ring
    PosIonizable:     [1.00, 0.00, 0.00]   # red    — positive ionisable
    NegIonizable:     [1.00, 0.45, 0.00]   # orange — negative ionisable (uncoloured by request; kept distinct)
    ExcludedVolume:   [0.55, 0.55, 0.55]   # grey   — receptor excluded-volume (density strategy)

# --- Consensus strategy -----------------------------------------------------
# Consensus features come from a single strategy: a Gaussian occupancy field (KDE)
# whose peaks become features (see `density` below and pharmacophore/density.py).
# Deterministic (fixed grid, no seeding). Outputs live in catalogue/<slug>/pharmacophores/.

# --- Density (consensus strategy) -------------------------------------------
# The scientific knobs are the length scale (voxel/bandwidth), the occupancy floor, and
# the membership radius (which defines support); the excluded-volume sub-block is a
# self-contained add-on.
density:
  voxel: 1.0              # grid spacing (A) — spatial resolution of the field
  bandwidth: 1.5         # Gaussian smoothing sigma (A) of the field that sets feature
                         #   POSITIONS and tolerances (~ target feature tolerance).
  peak_bandwidth: null   # smoothing sigma (A) of the SEPARATE field the peaks are read off,
                         #   and the min spacing between two kept peaks. Decoupled from
                         #   `bandwidth` so genuine multi-lobe sub-sites could resolve as
                         #   distinct peaks; keep <= bandwidth. null => use bandwidth (default).
                         #   NOTE: a sharper value fragments genuinely-broad conserved sites
                         #   (their basin mass splits below occupancy_floor), so it is off
                         #   until the floor/merge are made split-robust — see method doc.
  occupancy_floor: 2.0   # keep a peak only if its basin's summed distinct-molecule
                         #   weight >= this (units: effective molecules)
  # A ligand SUPPORTS a peak only if it has a feature point within this radius (A) of the
  # peak centre; support = distinct supporting ligands / total ligands (the 0.5 selection
  # floor gates on it). A hard-membership cutoff so a far basin outlier no longer counts.
  membership_radius: 1.5
  scaffold_weighting: false  # also weight points by inverse Murcko-scaffold frequency
  # Collapse overlapping features across families (a donor and an acceptor that land on
  # the same spot cannot both describe one binding position), keeping the denser peak.
  # 1.0 = fixed 1 A centre-to-centre cutoff (a small, predictable reach); null = geometric
  # (larger tolerance radius, 1-3 A, which over-reaches). Excluded-volume spheres are
  # exempt (receptor markers, not ligand chemistry). Removals are logged in
  # model_summary.md's "Merged away ... in favour of" table.
  merge_overlapping: true
  merge_radius: 1.0
  # Compatible co-located roles that are never merged into each other (unordered pairs):
  # a hydroxyl is genuinely Donor+Acceptor (so the merge must not delete the acceptor half —
  # this recovers e.g. estradiol's 17β-OH acceptor and the β2 catechol acceptors that
  # literature site-models keep); an aromatic ring is Aromatic+hydrophobe. Same-family and
  # other cross-family overlaps still merge to one feature per region.
  merge_exempt_pairs:
    - [Donor, Acceptor]
    - [Aromatic, LumpedHydrophobe]
  # Excluded-volume spheres: receptor atoms that line the pocket but no ligand reaches.
  excluded_volume: true
  ev_shell: 5.0          # consider protein atoms within this (A) of the ligand cloud
  ev_clearance: 2.0      # ...but beyond this (A) of every ligand atom (else occupied)
  ev_voxel: 2.0          # coarsen qualifying protein atoms onto this grid (one sphere each)
  ev_radius: 1.0         # excluded-volume sphere radius (A)
  ev_max: 40             # cap on the number of excluded-volume spheres

# --- Peak -> kept feature selection -----------------------------------------
selection:
  # Minimum number of known actives (distinct loadable poses) a cell must have to build a
  # model — below this the ensemble is too sparse to trust (a 0.5-support feature would rest
  # on only a couple of ligands), so the cell is skipped and any stale output removed. Set
  # from a coverage/quality review of the catalogue: n<10 cells produced notably weaker,
  # noisier models. Raising it trades target coverage for per-model robustness.
  min_ligands: 10
  # Keep a peak only if it draws support from at least this fraction of the ligands in
  # the cell (the T009 "present in most molecules" idea, made relative; support uses the
  # density.membership_radius). This 0.5 floor is the main feature-selection gate.
  min_support_fraction: 0.5
  min_cluster_size: 2          # minimum feature points behind a peak (sweep display floor)

# --- Tolerance (kept feature sphere radius, Angstrom) -----------------------
tolerance:
  # density_quantile: radius encloses `quantile` of the feature's (density-weighted) mass
  #   from the centre, so the far points still assigned to the cluster do not inflate it.
  #   (rmsd — root-mean-square point-to-centre distance — is the tail-sensitive alternative.)
  method: density_quantile
  quantile: 0.75               # fraction of density mass inside the sphere; lower = tighter
  min: 1.0                     # clamp so a tight cluster still has a usable radius
  max: 3.0                     # and a diffuse cluster does not balloon
