# config/pockets.yaml
# Stage 3 — pocket verification & naming.
#
# Pocket *discovery* is geometric and lives in code (contact fingerprints +
# overlap clustering, src/pharmpipe/groups/pocket.py). This file only supplies
# the curator knowledge needed to *name* the geometric clusters and to state what
# we expect, so departures from expectation surface as findings.
#
# Per target:
#   primary_label        name for the main site (the cluster holding the anchor /
#                        the largest cluster).
#   collapse_to_primary  true  -> merge every (non-singleton) geometric cluster
#                        into the primary label. Use ONLY where the Stage-2
#                        distance filter already restricts kept poses to a single
#                        functional site but cross-structure residue numbering
#                        fragments it (cross-species surrogates).
#   pockets.<label>.marker_hets
#                        HET codes diagnostic of a secondary site; a geometric
#                        cluster containing any marker takes that label.
#   expected_pockets     pockets we expect to see (sanity check, reported).
#
# A sizable cluster matching no marker and not the primary is labelled
# `secondary_<n>` and flagged for review; clusters smaller than
# `min_pocket_poses` are quarantined as outliers (they survived the coarse
# Stage-2 filter but are not a populated pocket).

defaults:
  contact_angstrom: 4.5
  jaccard_min: 0.30
  overlap_min: 0.60
  min_shared_residues: 5
  min_pocket_poses: 3

targets:
  nachr_a4b2:
    primary_label: orthosteric
    collapse_to_primary: true
    expected_pockets: [orthosteric, accessory]
    pockets:
      accessory:
        marker_hets: [NSE]      # NS9283 PAM at the alpha4(+)/alpha4(-) interface
    notes: >-
      The Stage-2 8 A filter keeps only subunit-interface poses; native numbering
      then fragments the orthosteric site across human alpha4/beta2 and the AChBP
      surrogates (Lymnaea/Aplysia), so geometric clusters are merged to one
      orthosteric label. Species/subtype is recorded per pose. The accessory
      alpha4(+)/alpha4(-) PAM site (NS9283) reuses the orthosteric aromatic box, so
      contact fingerprints cannot separate it; the NSE marker overrides its label
      to `accessory` per pose so the allosteric modulator is never pooled with the
      orthosteric agonists.

  esr1:
    primary_label: lbp
    expected_pockets: [lbp]
    notes: Ligand-binding-domain hormone pocket.

  hiv1_protease:
    primary_label: active_site
    expected_pockets: [active_site]

  adrb2:
    primary_label: orthosteric
    collapse_to_primary: true
    expected_pockets: [orthosteric]
    notes: >-
      All kept poses bind the single orthosteric catecholamine pocket; fusion-
      construct renumbering (T4L/BRIL) and long-acting-agonist exosite reach
      fragment the geometric clusters across structures, so they are merged to one
      orthosteric label. The Stage-2 distance filter already restricts kept poses
      to this site.

  cdk2:
    primary_label: atp_site
    expected_pockets: [atp_site]
    notes: ATP/hinge site. Allosteric binders were dropped by the Stage-2 filter.

  ca2:
    primary_label: active_site
    expected_pockets: [active_site]
    notes: Catalytic zinc / active-site funnel.

  ache:
    primary_label: gorge
    expected_pockets: [gorge]
    notes: >-
      Catalytic gorge (catalytic-anionic site + mid-gorge). Peripheral-anionic-
      site-only binders were dropped by the Stage-2 filter, so a single gorge
      pocket is expected here.

  cavab:
    primary_label: dhp_site
    expected_pockets: [dhp_site]
    notes: Central-cavity dihydropyridine drug site on the pore axis.

  cox2:
    primary_label: cox_channel
    expected_pockets: [cox_channel]
    notes: Cyclooxygenase channel (the heme site is separate and was filtered out).

  hmgcr:
    primary_label: hmg_site
    expected_pockets: [hmg_site]
    notes: Statin / HMG site (the NADPH cofactor site is separate).

  gaba_a:
    primary_label: orthosteric
    realign_global: true
    expected_pockets: [orthosteric, bzd_site]
    pockets:
      bzd_site:
        marker_hets: [DZP, "08H", EIE, R63, A1ADG, IYJ]
    notes: >-
      Orthosteric GABA site (beta(+)/alpha(-)) vs the benzodiazepine site
      (alpha(+)/gamma(-)). The BZ site is the stress-test split: PAM vs neutral
      antagonist vs inverse agonist. realign_global places each pose at its true
      subunit interface on the pentamer reference (the Stage-2 local fit stacks
      the BZ site onto the orthosteric one).

  net_slc6a2:
    primary_label: central_s1
    collapse_to_primary: true
    expected_pockets: [central_s1]
    notes: >-
      Central S1 substrate/inhibitor site. Human NET and the dDAT surrogate use
      different numbering, so geometric clusters are merged to one S1 label;
      species/subtype is recorded per pose.

  # --- 2026-06-19 target expansion (batch 2) -------------------------------
  nav1_7_vsd4:
    primary_label: vsd4_site
    collapse_to_primary: true
    expected_pockets: [vsd4_site]
    notes: >-
      Single VSD4 aryl-sulfonamide site (the Stage-2 anchor already isolates it).
      Cryo-EM constructs differ in beta-subunit content and numbering, so geometric
      clusters are merged to one label.

  nav1_7_pore:
    primary_label: pore_site
    collapse_to_primary: true
    expected_pockets: [pore_site]
    notes: >-
      Single central-cavity / local-anaesthetic pore site. As with the VSD4 slug,
      cross-construct numbering fragments the clusters, so they are merged.

  gr_nr3c1:
    primary_label: lbp
    expected_pockets: [lbp]
    notes: >-
      Ligand-binding-domain steroid pocket (the GR analogue of the ESR1 LBP). One
      soluble human NR3C1 numbering, so no collapse is needed.

  adora2a:
    primary_label: orthosteric
    collapse_to_primary: true
    expected_pockets: [orthosteric]
    notes: >-
      Single orthosteric adenosine pocket. GPCR fusion-construct renumbering
      (BRIL/T4L) fragments the geometric clusters across structures, so they are
      merged to one orthosteric label (as with adrb2).

  chrm2:
    primary_label: orthosteric
    collapse_to_primary: true
    expected_pockets: [orthosteric, allosteric]
    pockets:
      allosteric:
        marker_hets: [2CU]    # thienopyridine PAM in the extracellular vestibule (co-bound with ACh)
    notes: >-
      Orthosteric ACh pocket vs the extracellular-vestibule allosteric site. The
      allosteric modulator (2CU) is co-crystallised with orthosteric ACh in the same
      structure, so its HET marker overrides the label per pose (like the nAChR NSE
      accessory marker); GPCR renumbering otherwise collapses to the orthosteric
      label. If the allosteric poses fall outside the Stage-2 cutoff they simply do
      not appear — the marker only acts on poses that survive the filter.
