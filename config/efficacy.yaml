  # --- 2026-06-19 target expansion (batch 2) --------------------------------
  # Only textbook-certain drugs are seeded here (source: curated); every other
  # ligand is left to the ChEMBL fallback and the literature worklist, exactly as
  # the first batch was seeded. `unknown` is never defaulted away.

  # Nav1.7 — two channel drug sites. Use-/state-dependent Na-channel block is the
  # dominant pharmacology at both (negative), mirroring the cavab channel control.
  nav1_7_vsd4:
    class: control
    default_efficacy: negative          # VSD4 aryl-sulfonamide Nav1.7 inhibitor (blocker)
    notes: >-
      Selective aryl-sulfonamide inhibitors trap the DIV voltage sensor in the
      down state — functional channel block (negative). No activator chemotype is
      expected at this site.
    ligands:
      T70: {efficacy: negative, note: "PF-05089771, Nav1.7 VSD4 inhibitor"}
      # Stage 3.4 — literature curation (batch 2); PMID + conf in note.
      "5P2": {efficacy: negative, source: literature, note: "GX-936 aryl-sulfonamide VSD4 inhibitor (voltage-sensor trapping); PMID 26680203 (conf: high)"}
