# config/targets.yaml
# Target list + per-target options for the PDB ligand scrape & catalogue stage.
#
# UniProt accessions under `uniprot_hint` are STARTING POINTS to verify, not
# authoritative. The scraper resolves & verifies each target programmatically
# against UniProt/RCSB and records the accession(s) actually used plus the
# search date into the catalogue outputs (catalogue/<slug>/resolved.json).

search:
  # Organism policy: use HUMAN structures where possible. Surrogates are used
  # only for targets with no usable human structure, and are always labelled.
  organism_policy: human_preferred      # human_preferred | human_only | any
  human_taxonomy_id: 9606
  include_surrogates: true              # surrogates only fill gaps; always flagged
  extract_mode: all_instances          # all_instances | representative
  # Politeness / robustness for the network stage (login node on Gadi).
  max_parallel_downloads: 4
  request_retries: 4
  request_backoff_seconds: 2.0
  cache_offline_ok: true

targets:
  - name: Nicotinic acetylcholine receptor (alpha4beta2)
    slug: nachr_a4b2
    genes: [CHRNA4, CHRNB2]
    organism: human
    uniprot_hint: [P43681, P17787]
    surrogates:
      # Pharmacophore ground truth often derives from AChBP co-crystals.
      - { name: "AChBP (Lymnaea stagnalis)", uniprot: P58154, kind: surrogate }
      - { name: "AChBP (Aplysia californica)", uniprot: Q8WSF8, kind: surrogate }
    notes: "Acetylcholine receptor disambiguated to neuronal nicotinic a4b2."

  - name: Estrogen receptor alpha
    slug: esr1
    genes: [ESR1]
    organism: human
    uniprot_hint: [P03372]
    notes: "Mostly ligand-binding-domain structures; large set."

  - name: HIV-1 protease
    slug: hiv1_protease
    genes: [gag-pol]
    organism: virus
    uniprot_hint: [P04585]
    notes: "Cleaved from Gag-Pol polyprotein; very large set. Bridging/structural waters functionally important — note in catalogue."

  - name: Beta-2 adrenoceptor
    slug: adrb2
    genes: [ADRB2]
    organism: human
    uniprot_hint: [P07550]
    notes: "GPCR; many constructs use fusion partners (T4 lysozyme, BRIL) and thermostabilising mutations — do not catalogue fusion-partner ligands as target ligands."

  - name: Cyclin-dependent kinase 2 (CDK2)
    slug: cdk2
    genes: [CDK2]
    organism: human
    uniprot_hint: [P24941]
    notes: "With and without cyclin A; bridging water in hinge/ATP site is a known caveat."

  - name: Carbonic anhydrase II
    slug: ca2
    genes: [CA2]
    organism: human
    uniprot_hint: [P00918]
    notes: "Isoform II (human). Catalytic Zn2+ is a cofactor — KEEP."

  - name: Acetylcholinesterase
    slug: ache
    genes: [ACHE]
    organism: human
    uniprot_hint: [P22303]
    notes: "Human-only per scope decision (2026-06-11). Torpedo/mouse surrogates excluded unless re-enabled."

  - name: CavAb (Ca2+-selective NavAb mutant)
    slug: cavab
    genes: []
    organism: bacteria
    uniprot_hint: [A8EVM5]
    surrogates:
      - { name: "NavAb (Arcobacter butzleri), CavAb engineered mutant", uniprot: A8EVM5, kind: surrogate }
    notes: "Engineered bacterial surrogate; no human equivalent. Small set; flag as surrogate."

  - name: Cyclooxygenase-2 (PTGS2)
    slug: cox2
    genes: [PTGS2]
    organism: human
    uniprot_hint: [P35354]
    notes: "Human-only per scope decision (2026-06-11). Murine/ovine excluded unless re-enabled. Heme is a cofactor — KEEP."

  - name: HMG-CoA reductase
    slug: hmgcr
    genes: [HMGCR]
    organism: human
    uniprot_hint: [P04035]
    notes: "Statin/inhibitor complexes."

  - name: GABA-A receptor
    slug: gaba_a
    genes: [GABRA1, GABRB2, GABRB3, GABRG2]
    organism: human
    uniprot_hint: [P14867, P18507]
    notes: "Human GABA-A-subunit-mapped structures (scope: human where possible). Pentameric, many compositions, mostly cryo-EM; many lipids/detergents to filter."

  - name: Norepinephrine transporter (NET, SLC6A2)
    slug: net_slc6a2
    genes: [SLC6A2]
    organism: human
    uniprot_hint: [P23975]
    surrogates:
      # dDAT historically used as a structural surrogate for SLC6 transporters.
      - { name: "Drosophila dopamine transporter (dDAT)", uniprot: Q7K4Y6, kind: surrogate }
    notes: "SLC6 transporter (NOT an adrenergic receptor). Human structures are recent cryo-EM. dDAT surrogate included only as gap-filler, labelled."

  # --- 2026-06-19 target expansion (batch 2) -------------------------------
  # Nav1.7 has two well-separated drug sites in different channel domains (the
  # VSD4 aryl-sulfonamide site and the central-pore local-anaesthetic site). They
  # do NOT co-superpose the way GABA-A's two interface sites do, so the single-slug
  # realign_global trick cannot keep both; instead we model each as its own
  # single-site slug off the same SCN9A scrape. Both entries resolve to the same
  # accession and return the same structures — only the site anchor (sites.yaml)
  # differs, so each keeps the poses at its own site.
  - name: Voltage-gated sodium channel Nav1.7 (VSD4 site)
    slug: nav1_7_vsd4
    genes: [SCN9A]
    organism: human
    uniprot_hint: [Q15858]
    notes: >-
      Human Nav1.7 (alpha subunit), voltage-sensor-domain-4 aryl-sulfonamide drug
      site (PF-05089771 and the selective sulfonamide series). Recent cryo-EM,
      often with beta auxiliary subunits and bound toxins/lipids. Aryl-sulfonamide
      inhibitor co-crystals in the wider literature are frequently VSD4 *chimeras*
      (NavAb/NavPaS backbone with the Nav1.7 VSD4 grafted in); those map to a
      different accession and are not pulled by the Q15858 search — keep human
      Nav1.7 in scope, add a chimera surrogate here labelled only if later wanted.

  - name: Voltage-gated sodium channel Nav1.7 (pore site)
    slug: nav1_7_pore
    genes: [SCN9A]
    organism: human
    uniprot_hint: [Q15858]
    notes: >-
      Human Nav1.7 (alpha subunit), central-cavity / local-anaesthetic pore drug
      site (vixotrigine, levobupivacaine, lacosamide, carbamazepine-like). Same
      SCN9A scrape as nav1_7_vsd4; the pore anchor in sites.yaml selects this site.

  - name: Glucocorticoid receptor
    slug: gr_nr3c1
    genes: [NR3C1]
    organism: human
    uniprot_hint: [P04150]
    notes: "Mostly ligand-binding-domain structures (steroid pocket); nuclear-receptor LBD analogue of ESR1."

  - name: Adenosine A2A receptor
    slug: adora2a
    genes: [ADORA2A]
    organism: human
    uniprot_hint: [P29274]
    notes: "Class-A GPCR; many constructs use fusion partners (BRIL/apocytochrome b562RIL, T4 lysozyme) and thermostabilising mutations — do not catalogue fusion-partner ligands as target ligands. Large set."

  - name: Muscarinic acetylcholine receptor M2
    slug: chrm2
    genes: [CHRM2]
    organism: human
    uniprot_hint: [P08172]
    notes: >-
      Class-A GPCR; acetylcholine receptor disambiguated to muscarinic M2. Has a
      distinct extracellular allosteric (modulator) site above the orthosteric ACh
      pocket — the orthosteric/allosteric split is a known second pocket here.
      Constructs may use T4L/BRIL fusions and nanobody/G-protein mimetics.

  # --- 2026-06-23 target expansion (batch 3) -------------------------------
  - name: Dopamine receptor D1
    slug: drd1
    genes: [DRD1]
    organism: human
    uniprot_hint: [P21728]
    notes: >-
      Class-A GPCR; dopamine receptor disambiguated to the D1 subtype — the most
      structurally covered of D1-D5 (31 PDB entries / 21 unique kept ligands at
      scrape-survey time vs <=11 entries for any other subtype), so it gives the
      best-defined pharmacophore. Mostly recent active-state cryo-EM Gs-protein
      complexes, so GDP/GTP/Mg are G-protein cofactors (routed to separate_state,
      not receptor ligands), and constructs may use BRIL/T4L fusions and
      thermostabilising mutations — do not catalogue fusion-partner ligands as
      target ligands. The orthosteric pocket holds both catecholamine and
      non-catechol agonists plus antagonists (the agonist/antagonist split we want).
