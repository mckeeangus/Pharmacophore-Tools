# config/efficacy.yaml
# Stage 3 — efficacy-sign annotation and reference-state routing.
#
# A co-crystal is SILENT on functional direction, so efficacy is external
# pharmacology and must be curated, not inferred. This file is the single place
# that knowledge lives; the pipeline only reads it (no efficacy is guessed from
# structure or ligand names in code).
#
# Provenance & honesty (`source:`, highest-confidence first):
#   * `literature` — Stage 3.4 manual curation: the efficacy direction was read
#     from the structure's PRIMARY publication (PMID + confidence recorded in the
#     note). This is the top tier; per-ligand site / pose_source / PMID for every
#     curated ligand live in `catalogue/curation/literature_curation_traceability.csv`.
#   * `prelabelled` — verified against RCSB / a known drug identity at scrape time.
#   * `curated` — curator assignment from standard pharmacology (textbook drug
#     class / IUPHAR-BPS). MUST be verified at the relevant subtype before
#     publication. No database IDs are fabricated; `source` denotes the assertion.
#   * Below all of the above sits the ChEMBL-resolved fallback
#     (`catalogue/stage3_efficacy_resolved.csv`); an explicit entry here always
#     wins over it.
#   * Anything not listed (and with no target `default_efficacy`) is reported as
#     `unknown` and sent to a review list — never silently bucketed. Subtype rule:
#     a sign is never transferred across a subtype/system boundary, so ligands
#     characterised only at a different subtype stay `unknown`.
#
# efficacy: positive | neutral | negative
#   positive  agonist / PAM / activator / transporter substrate-releaser
#   neutral   neutral antagonist / silent binder
#   negative  inverse agonist / NAM / enzyme inhibitor / reuptake inhibitor
#
# track: separate_state  routes a ligand OUT of the reversible-binder cells
#   (covalent/irreversible, reactivator of an adducted enzyme, degrader, or a
#   catalytic substrate/product/cofactor). Requires a `reason`.
#
# default_efficacy (optional): applies to every reversible ligand of a target
#   that has no explicit entry. Use ONLY for single-mechanism (control) targets
#   where one documented effect dominates the site; exceptions are overridden.

defaults:
  source: curated

targets:

  # --- control / single-mechanism targets (documented default) -------------

  cox2:
    class: control
    default_efficacy: negative          # COX-channel inhibitor (NSAID/coxib)
    notes: >-
      Reversible/time-dependent kinetics are a sub-mode, not an effect split.
      Aspirin (covalent, HET AIN) is absent from the kept poses — its
      separate-state cell is empty here.
    ligands:
      SAL: {efficacy: negative, note: "salicylic acid, reversible COX inhibitor"}

  hiv1_protease:
    class: control
    default_efficacy: negative          # active-site protease inhibitor
    notes: Non-human / resistance-mutant variants kept in metadata.

  hmgcr:
    class: control
    default_efficacy: negative          # statin / HMG-site inhibitor
    ligands:
      HMG: {track: separate_state, reason: "HMG-CoA substrate/cofactor, not an inhibitor"}
      MAH: {track: separate_state, reason: "HMG substrate/product analogue"}

  cdk2:
    class: control
    default_efficacy: negative          # ATP-competitive CDK2 inhibitor
    notes: Multiplicity here should be pocket/mode, never an efficacy split.
    ligands:
      ATP: {track: separate_state, reason: "ATP cofactor/substrate, not an inhibitor"}
      SGM: {efficacy: unknown, note: "monothioglycerol cryo-additive (curation slip)"}

  ache:
    class: multi_site
    default_efficacy: negative          # reversible AChE inhibitor
    notes: >-
      Two separate-state tracks routed out: organophosphyl-serine covalent
      adducts (the OP-inhibited enzyme) and oxime reactivators (defined against
      that adducted state, not the native enzyme).
    ligands:
      # organophosphyl-serine covalent adducts
      VX:  {track: separate_state, reason: "organophosphyl-serine covalent adduct"}
      DEP: {track: separate_state, reason: "organophosphyl-serine covalent adduct"}
