[workspace]
authors = ["Angus McKee <u7457676@anu.edu.au>"]
channels = ["conda-forge"]
name = "Pharmacophore_Construction"
# linux-64 kept alongside win-64 so the environment is reproducible on Gadi.
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[tasks]
# Network-heavy: run on a login/data-mover node on Gadi (compute nodes have no internet).
# Extra args pass through, e.g. `pixi run scrape-pdb-ligands --config config/targets.yaml`.
scrape-pdb-ligands = "python scripts/scrape_pdb_ligands.py"
# Align kept ligands into a per-target reference frame + write PyMOL .pml sessions.
# Network-heavy (downloads every structure holding a kept ligand) -> login node on Gadi.
align-sites = "python scripts/align_sites.py"
# Bake .pml sessions into .pse files (needs PyMOL): pixi run -e viz build-sessions
build-sessions = "python scripts/align_sites.py --sessions-only"
# Stage 3.3: resolve `unknown` ligand efficacy via ChEMBL (network -> login node).
# Caches responses under data/_cache/chembl; output feeds the offline grouping.
resolve-efficacy = "python scripts/resolve_efficacy.py"
# Stage 3: pocket-verified, effect-based grouping of the site-aligned poses.
# Offline (cached structures + catalogue). Bake .pse with: pixi run -e viz group-effects
group-effects = "python scripts/group_effects.py"
# Stage 4: build ligand-based ensemble pharmacophores from the grouped cells.
# Offline (uses the tracked catalogue). e.g. pixi run build-pharmacophores --catalogue
build-pharmacophores = "python scripts/build_pharmacophores.py"
test = { cmd = "pytest -q", depends-on = [] }
lint = "ruff check ."

# --- Common, lightweight dependencies shared by every environment ---
[dependencies]
python = "3.12.*"

# --- core: networking, config, tabular IO (light, rarely breaks) ---
[feature.core.dependencies]
requests = ">=2.31"
pyyaml = ">=6.0"
pandas = ">=2.0"
tqdm = ">=4.66"

# Note: we query the RCSB Search + Data APIs directly via `requests` (plain JSON)
# rather than via `rcsbsearchapi`. That package builds its query schema from RCSB
# at import time and is brittle/network-coupled; a direct client is more robust
# and HPC-portable (no import-time network dependency on Gadi login nodes).

# Editable install of this project so `import pharmpipe` works everywhere.
[feature.core.pypi-dependencies]
pharmpipe = { path = ".", editable = true }

# --- chem: heavy/brittle cheminformatics & structure parsing, isolated ---
[feature.chem.dependencies]
rdkit = ">=2024.03"
openbabel = ">=3.1"
gemmi = ">=0.6"
openpyxl = ">=3.1"

# --- dev: testing & linting ---
[feature.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.5"

# --- viz: PyMOL, isolated so its heavy Qt/GL stack never blocks core/chem.
# Only needed to bake .pse session files; the align stage always writes portable
# .pml scripts using gemmi (in `chem`) without PyMOL.
[feature.viz.dependencies]
pymol-open-source = ">=2.5"

# --- ph4: pharmacophore construction (Stage 4) — clustering + raw-data plots.
# scikit-learn (k-means + silhouette) and matplotlib (offline 3D feature scatter).
# Feature extraction itself uses rdkit (in `chem`); these add the clustering/plot side.
[feature.ph4.dependencies]
scikit-learn = "*"
matplotlib = "*"

[environments]
default = { features = ["core", "chem", "ph4"], solve-group = "main" }
dev = { features = ["core", "chem", "ph4", "dev"], solve-group = "main" }
viz = { features = ["core", "chem", "ph4", "viz"], solve-group = "main" }
