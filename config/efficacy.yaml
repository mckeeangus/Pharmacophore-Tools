  nav1_7_pore:
    class: control
    default_efficacy: negative          # central-pore use-dependent Na-channel blocker
    notes: >-
      Local anaesthetics / anticonvulsant Na-channel blockers dominate the central
      cavity (negative). Pore-acting channel ACTIVATORS (e.g. veratridine, a
      neurotoxin-site opener) are the exception and are left `unknown` rather than
      defaulted, so they never enter the blocker pharmacophore.
    ligands:
      OJ0:   {efficacy: negative, source: literature, note: "levobupivacaine, local-anaesthetic pore blocker (site BIG); PMID 37270609 (conf: high)"}
      TB4:   {efficacy: negative, note: "vixotrigine, use-dependent Na-channel blocker"}
      LQO:   {efficacy: negative, note: "lacosamide, enhances slow inactivation (blocker)"}
      A1E26: {efficacy: unknown,  note: "veratridine — Nav ACTIVATOR (neurotoxin site), not a pore blocker; left unknown, not defaulted"}
      # 9Z9 (7W9K) is a GDN-type detergent/sterol mispaired into the pore worklist
      # (toxin-gating paper, not a pore blocker) — stays unknown, never a cell.

