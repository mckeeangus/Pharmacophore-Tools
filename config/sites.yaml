# config/sites.yaml
# Binding-site definitions for the alignment / visualisation stage.
#
# For each model system we pick ONE reference structure and an "anchor" — the
# HET code of the ligand or ion that marks the binding site of interest (e.g.
# acetylcholine for the nAChR orthosteric site, the catalytic Zn for carbonic
# anhydrase). Every kept ligand instance is superposed into that reference's
# frame using a *binding-site-local* fit (pocket Calpha atoms only); an instance
# is kept only if, after superposition, its centroid lands within `cutoff` of
# the anchor — i.e. it really binds where the reference ligand binds.
#
# All reference PDBs + anchors below are drawn from structures that are already
# in our catalogue (catalogue/<slug>/), so they are guaranteed in-scope.

defaults:
  pocket_shell_angstrom: 10.0   # Calpha atoms within this of the anchor define the local superposition selection
  cutoff_angstrom: 8.0          # an instance is "at the site" if its centroid is within this of the anchor (ref frame)
  match_distance_angstrom: 2.5  # after a global fit, ref/candidate Calpha within this are treated as corresponding
  max_pocket_rmsd_angstrom: 3.0 # reject instances whose pocket superposition is worse than this (no matching pocket)
  min_pocket_atoms: 8           # need at least this many matched pocket Calpha to trust the fit
  # Iterative pocket-local refinement (ICP) of the binding-site overlay. The global
  # sequence fit only initialises; these knobs drive the refinement that keeps the
  # geometry of pocket-lining residues constant across structures (critical for
  # low-identity surrogates such as AChBP/dDAT). See src/pharmpipe/sites/align.py.
  refine_iterations: 10              # max ICP iterations (re-pair + re-fit); converges fast
  refine_pair_radius_angstrom: 4.0  # capture radius when re-pairing a pocket residue to a candidate
  anchor_weight_sigma_angstrom: 6.0 # Gaussian weight on each residue's Calpha-anchor distance
                                    #   (smaller -> tighter focus on the immediate site; 6.0 balances
                                    #    surrogate inner-site RMSD vs worst-case stability)
  use_backbone: true                # superpose on N,CA,C,O (constrains orientation) vs Calpha only

sites:
  nachr_a4b2:
    reference_pdb: 8ST4
    anchor_het: ACH            # acetylcholine — the orthosteric site itself
    notes: >-
      Orthosteric ACh site (aromatic box). The receptor has several equivalent
      alpha/beta interfaces; per-instance local superposition overlays each copy
      onto the canonical pocket. Multi-interface symmetry handling is a known
      follow-up (instances at a non-canonical interface may be dropped for now).

  esr1:
    reference_pdb: 7NEL
    anchor_het: EST            # 17-beta-estradiol in the LBD hormone pocket
    notes: Estrogen-receptor ligand-binding-domain pocket.

  hiv1_protease:
    reference_pdb: 1DMP
    anchor_het: DMQ            # cyclic-urea protease inhibitor bound in 1DMP (active site)
    notes: >-
      The P04585 (Gag-Pol) search also returns reverse-transcriptase structures;
      anchoring on a protease active-site inhibitor rejects RT-bound poses
      (e.g. nevirapine/efavirenz) that do not belong to the protease site.

  adrb2:
    reference_pdb: 2RH1
    anchor_het: CAU            # carazolol — orthosteric catecholamine pocket
    notes: Excludes T4L/BRIL fusion-partner and lipid ligands away from the pocket.

  cdk2:
    reference_pdb: 4EOJ
    anchor_het: ATP            # ATP / hinge catalytic site
    notes: ATP-site anchor; drops cryo-additives (e.g. SGM) and any allosteric binders.

  ca2:
    reference_pdb: 3K34
    anchor_het: ZN             # catalytic zinc — the active site itself (1153 structures)
    notes: >-
      Anchored on the catalytic Zn2+ rather than any one inhibitor (all active-site
      inhibitors coordinate it). Surface mercury adducts (MBO/BE7) fall outside cutoff.

  ache:
    reference_pdb: 6O4W
    anchor_het: E20            # donepezil — spans the catalytic gorge
    notes: Catalytic gorge / active site.

  cavab:
    reference_pdb: 6KE5
    anchor_het: 6UB            # amlodipine — central-cavity drug site
    notes: >-
      Engineered surrogate. Central-cavity drug site on the pore axis (the Ca2+
      ions sit in the selectivity filter, a different location).

  cox2:
    reference_pdb: 5KIR
    anchor_het: RCX            # rofecoxib in the cyclooxygenase channel
    notes: COX channel (the heme cofactor COH is a separate site). Only 7 human structures.

  hmgcr:
    reference_pdb: 1HWK
    anchor_het: "117"          # atorvastatin — HMG/statin site
    notes: Statin site (ADP/CoA bind the separate NADPH cofactor site).

  gaba_a:
    reference_pdb: 9EQG
    anchor_het: ABU            # GABA — orthosteric agonist site
    notes: >-
      Orthosteric GABA (agonist) site at the beta(+)/alpha(-) interface — the
      direct analogue of "where acetylcholine binds" for nAChR. Excludes the
      benzodiazepine site, anaesthetic sites, and membrane lipids. Multi-interface
      symmetry handling is the same known follow-up as nAChR.

  net_slc6a2:
    reference_pdb: 8ZOY
    anchor_het: LNR            # L-noradrenaline — central S1 substrate site
    notes: Central S1 substrate/inhibitor site; excludes detergents/lipids.

  # --- 2026-06-19 target expansion (batch 2) -------------------------------
  nav1_7_vsd4:
    reference_pdb: 8I5G
    anchor_het: T70            # PF-05089771 — VSD4 aryl-sulfonamide drug site
    notes: >-
      Voltage-sensor-domain-4 (DIV-S4) aryl-sulfonamide site, the Nav1.7-selective
      drug pocket. Anchored on PF-05089771 (T70); the central-pore local-anaesthetic
      poses sit in a different channel domain and fall outside the cutoff (they are
      modelled separately as nav1_7_pore). Bound lipids/detergents are excluded.

  nav1_7_pore:
    reference_pdb: 8I5B
    anchor_het: OJ0            # levobupivacaine — central-cavity local-anaesthetic site
    notes: >-
      Central-cavity / local-anaesthetic pore site on the channel axis. Anchored on
      levobupivacaine (OJ0); VSD4 sulfonamide poses fall outside the cutoff (modelled
      as nav1_7_vsd4). Membrane lipids/detergents excluded.

  gr_nr3c1:
    reference_pdb: 1M2Z
    anchor_het: DEX            # dexamethasone — steroid ligand-binding-domain pocket
    notes: >-
      Glucocorticoid-receptor LBD steroid pocket (the nuclear-receptor analogue of
      the ESR1 hormone pocket). Anchored on dexamethasone; surface Zn/Mg ions and
      crystallisation additives fall outside the cutoff.

  adora2a:
    reference_pdb: 5NM4
    anchor_het: ZMA            # ZM-241385 — orthosteric adenosine pocket
    notes: >-
      Orthosteric adenosine pocket. Anchored on ZM-241385 (ZMA); this one site holds
      both the xanthine/triazolotriazine antagonists and the adenosine/NECA agonists,
      which is exactly the agonist-vs-antagonist split we want. Excludes T4L/BRIL
      fusion-partner ligands and the many bound lipids/detergents/alkanes.

  chrm2:
    reference_pdb: 7T94
    anchor_het: ACH            # acetylcholine — orthosteric muscarinic pocket
    notes: >-
      Orthosteric acetylcholine pocket. Anchored on ACh; the extracellular-vestibule
      allosteric modulator site sits just above it — if its poses survive the cutoff
      they are split out geometrically in Stage 3 (allosteric marker in pockets.yaml),
      never pooled with the orthosteric agonists/antagonists.

  # --- 2026-06-23 target expansion (batch 3) -------------------------------
  drd1:
    reference_pdb: 9LLJ
    anchor_het: LDP            # dopamine — orthosteric catecholamine pocket
    notes: >-
      Orthosteric dopamine pocket. Anchored on dopamine (LDP), the endogenous
      agonist and the most widely bound ligand (12 of 31 structures); this single
      site holds the catecholamine and non-catechol agonists and the antagonists,
      giving the agonist-vs-antagonist split. Excludes BRIL/T4L fusion-partner
      ligands and the active-state G-protein nucleotides (GDP/GTP/Mg), which sit far
      from the pocket and fall outside the cutoff.
